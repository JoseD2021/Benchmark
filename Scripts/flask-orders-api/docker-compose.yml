services:
  api:
    build: .
    container_name: api-orders-flask
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=orders_db
      - DB_POOL_MAX=1
    ports:
      - "5001:5001"

  db:
    image: postgres:16
    container_name: db-orders-flask
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=orders_db
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data:z
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orders_db"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  dbdata:
